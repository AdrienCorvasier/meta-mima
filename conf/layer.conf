# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mima"
BBFILE_PATTERN_meta-mima = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mima = "6"

LAYERDEPENDS_meta-mima = "core"
LAYERSERIES_COMPAT_meta-mima = "wrynose"
