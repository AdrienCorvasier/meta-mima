#@TYPE: Machine
#@NAME: RaspberryPi 4 Development Board (64bit) - mima layer override
#@DESCRIPTION: Custom machine configuration for the RaspberryPi 4 in the meta-mima layer.

require ../../../meta-raspberrypi/conf/machine/raspberrypi4-64.conf

ENABLE_UART = "1"
RPI_USE_U_BOOT = "1"
GPU_MEM = "16"

# This target is a CM4 on an IO Board, not a standalone Pi4B: its USB-A
# ports run through an on-board USB 2.0 hub wired to the SoC's dwc2 OTG
# controller, not through a VL805/PCIe xHCI chip, so the earlier
# "brcm-pcie ...: link down" in dmesg is just an unpopulated PCIe lane, not a
# fault. dwc2 is disabled by default on the CM4 to save power and must be
# forced into host mode, per the CM4 IO Board datasheet.
RPI_EXTRA_CONFIG += "dtoverlay=dwc2,dr_mode=host\n"

# Harmless to keep even though it wasn't the actual USB cause on this board.
RPI_EXTRA_CONFIG += "usb_max_current_enable=1\n"

# MS5837 depth/pressure sensor. The Linux driver (ms5637.ko, CONFIG_MS5637)
# already natively matches "meas,ms5837" and is built + pulled onto the
# image via the stock kernel-modules RRECOMMENDS, so no recipe changes are
# needed for the driver itself. Two things it does need, though:
#  - I2C is off by default on this board (dtparam=i2c_arm=off, commented out
#    in the stock config.txt).
#  - The overlay that instantiates the sensor at its I2C address
#    (overlays/i2c-sensor.dtbo, which has the ms5837@76 fragment) isn't in
#    meta-raspberrypi's default RPI_KERNEL_DEVICETREE_OVERLAYS allowlist, so
#    it's never even compiled/deployed unless added here.
RPI_KERNEL_DEVICETREE_OVERLAYS += "overlays/i2c-sensor.dtbo"
RPI_EXTRA_CONFIG += "dtparam=i2c_arm=on\n"
RPI_EXTRA_CONFIG += "dtoverlay=i2c-sensor,ms5837\n"

# Disable Bluetooth support on this image
MACHINE_FEATURES_OPTED_OUT:append = " bluetooth"
MACHINE_EXTRA_RRECOMMENDS:remove = " bluez-firmware-rpidistro-bcm4345c0-hcd bluez-firmware-rpidistro-bcm4345c5-hcd"
